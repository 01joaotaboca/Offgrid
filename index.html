<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Grade de Amostragem de Solo</title>
<meta name="theme-color" content="#0d1f14">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{
    --verde-esc:#0d1f14;
    --verde:#123822;
    --verde-2:#1c4d2e;
    --ouro:#f0c040;
    --ouro-esc:#c99a2e;
    --texto:#eaf3ec;
    --texto-fraco:#9fb5a7;
    --erro:#e0665a;
    --ok:#5ac084;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--verde-esc);
    font-family:'DM Sans',-apple-system,sans-serif; color:var(--texto);}
  @font-face{font-family:'Syne';src:local('Syne');}
  h1,h2,h3,.titulo{font-family:'Syne','Bebas Neue',sans-serif;letter-spacing:.3px;}
  #app{position:relative;width:100%;height:100%;}
  #map{position:absolute;inset:0;z-index:1;}

  header{
    position:absolute; top:0; left:0; right:0; z-index:500;
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 12px; background:linear-gradient(180deg,rgba(13,31,20,.95),rgba(13,31,20,.75) 70%,transparent);
    pointer-events:none;
  }
  header .brand{display:flex;align-items:center;gap:8px;pointer-events:auto;}
  header .brand svg{width:26px;height:26px;flex:0 0 auto;}
  header .brand span{font-size:15px;font-weight:700;color:var(--ouro);}
  header .actions{display:flex;gap:8px;pointer-events:auto;}
  .icon-btn{
    width:38px;height:38px;border-radius:10px;border:1px solid rgba(240,192,64,.35);
    background:rgba(18,56,34,.85); color:var(--ouro); display:flex;align-items:center;justify-content:center;
    font-size:17px; cursor:pointer;
  }
  .icon-btn:active{transform:scale(.94);}

  #painel{
    position:absolute; left:0; right:0; bottom:0; z-index:600;
    background:var(--verde); border-top:1px solid rgba(240,192,64,.25);
    border-radius:18px 18px 0 0; box-shadow:0 -8px 24px rgba(0,0,0,.4);
    max-height:78vh; display:flex; flex-direction:column;
    transform:translateY(calc(100% - 58px)); transition:transform .28s ease;
  }
  #painel.aberto{transform:translateY(0);}
  #alca{
    display:flex; flex-direction:column; align-items:center; padding:9px 0 6px;
    cursor:pointer;
  }
  #alca .barra{width:42px;height:4px;border-radius:3px;background:rgba(240,192,64,.4);}
  #alca .resumo{font-size:12.5px;color:var(--texto-fraco);margin-top:6px;display:flex;gap:14px;}
  #alca .resumo b{color:var(--ouro);}

  #conteudo{overflow-y:auto; padding:2px 16px 22px; flex:1;}
  .secao{margin-top:14px;}
  .secao h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;color:var(--texto-fraco);letter-spacing:.6px;}

  .linha-btns{display:flex;gap:8px;flex-wrap:wrap;}
  .btn{
    border:1px solid rgba(240,192,64,.35); background:var(--verde-2); color:var(--texto);
    padding:10px 14px;border-radius:10px;font-size:13.5px;font-weight:600;cursor:pointer;
    display:flex;align-items:center;gap:6px; flex:1; justify-content:center; min-width:0;
  }
  .btn.ouro{background:var(--ouro);color:var(--verde-esc);border-color:var(--ouro);}
  .btn.perigo{border-color:rgba(224,102,90,.5); color:var(--erro);}
  .btn:active{transform:scale(.97);}
  .btn:disabled{opacity:.4;pointer-events:none;}
  .btn.sm{padding:8px 10px;font-size:12.5px;flex:none;}

  label.campo{display:block;font-size:12px;color:var(--texto-fraco);margin:10px 0 5px;}
  input[type=number], input[type=text]{
    width:100%; background:var(--verde-esc); border:1px solid rgba(240,192,64,.3); color:var(--texto);
    padding:10px 12px; border-radius:9px; font-size:14.5px;
  }
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .presets{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;}
  .preset{
    flex:0 0 auto;border:1px solid rgba(240,192,64,.3);background:var(--verde-esc);color:var(--ouro);
    padding:7px 11px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap;cursor:pointer;
  }
  .preset.ativo{background:var(--ouro);color:var(--verde-esc);}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px;}
  .stat{background:var(--verde-esc);border-radius:10px;padding:9px 8px;text-align:center;}
  .stat b{display:block;font-size:16px;color:var(--ouro);}
  .stat span{font-size:10.5px;color:var(--texto-fraco);}

  .toggle-modo{display:flex;background:var(--verde-esc);border-radius:10px;padding:3px;margin-top:4px;}
  .toggle-modo div{flex:1;text-align:center;padding:8px 4px;font-size:12px;border-radius:8px;cursor:pointer;color:var(--texto-fraco);}
  .toggle-modo div.ativo{background:var(--ouro);color:var(--verde-esc);font-weight:700;}

  #lista-pontos{margin-top:6px;max-height:170px;overflow-y:auto;border-radius:10px;background:var(--verde-esc);}
  .item-ponto{
    display:flex;justify-content:space-between;align-items:center;padding:9px 12px;
    border-bottom:1px solid rgba(255,255,255,.06); font-size:12.5px;
  }
  .item-ponto:last-child{border-bottom:none;}
  .item-ponto b{color:var(--ouro);}
  .item-ponto .coord{color:var(--texto-fraco);font-size:11.5px;}

  #talhoes-salvos .item-talhao{
    display:flex;justify-content:space-between;align-items:center;padding:10px 12px;
    background:var(--verde-esc);border-radius:9px;margin-bottom:7px;font-size:13px;
  }
  #talhoes-salvos .item-talhao span{opacity:.75;font-size:11.5px;}

  #toast{
    position:absolute; top:64px; left:50%; transform:translateX(-50%) translateY(-14px);
    background:var(--verde-2); color:var(--texto); border:1px solid var(--ouro-esc); padding:10px 16px;
    border-radius:10px; font-size:13px; z-index:900; opacity:0; pointer-events:none; transition:.25s;
    max-width:88%; text-align:center;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .leaflet-container{background:#0a1710;}
  .rotulo-ponto{
    background:var(--ouro); color:var(--verde-esc); font-weight:800; font-size:10.5px;
    border-radius:50%; width:20px;height:20px;display:flex;align-items:center;justify-content:center;
    border:2px solid var(--verde-esc);
  }
  .rodape-app{text-align:center;font-size:10px;color:var(--texto-fraco);margin-top:16px;opacity:.6;}

  .barra-progresso{width:100%;height:8px;border-radius:5px;background:var(--verde-esc);overflow:hidden;margin-top:8px;display:none;}
  .barra-progresso .fill{height:100%;width:0%;background:var(--ouro);transition:width .15s;}
  .progresso-txt{font-size:11.5px;color:var(--texto-fraco);margin-top:4px;display:none;}
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>

  <header>
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none"><rect x="1" y="1" width="22" height="22" rx="5" fill="#123822" stroke="#f0c040" stroke-width="1.4"/><path d="M8 4v16M16 4v16M4 8h16M4 16h16" stroke="#f0c040" stroke-width="1.3"/></svg>
      <span>Grade de Solo</span>
    </div>
    <div class="actions">
      <button class="icon-btn" id="btn-camada" title="Alternar mapa/satélite">🛰️</button>
      <button class="icon-btn" id="btn-gps" title="Minha localização">📍</button>
      <button class="icon-btn" id="btn-instalar" style="display:none;" title="Instalar app">⬇️</button>
    </div>
  </header>

  <div id="toast"></div>

  <div id="painel" class="aberto">
    <div id="alca">
      <div class="barra"></div>
      <div class="resumo" id="dica-alca">
        <span>Área: <b id="resumo-area">0,00 ha</b></span>
        <span>Pontos: <b id="resumo-pontos">0</b></span>
        <span id="seta-alca" style="color:var(--ouro);">▲ fechar</span>
      </div>
    </div>

    <div id="conteudo">

      <div class="secao">
        <h3>1. Talhão</h3>
        <div class="linha-btns">
          <button class="btn ouro" id="btn-desenhar">✏️ Desenhar talhão</button>
          <button class="btn" id="btn-fechar" disabled>✅ Fechar</button>
          <button class="btn perigo" id="btn-limpar">🗑️ Limpar</button>
        </div>
        <div class="linha-btns" style="margin-top:8px;">
          <button class="btn sm" id="btn-add-gps" disabled>➕ Adicionar meu GPS</button>
          <button class="btn sm" id="btn-desfazer" disabled>↩️ Desfazer ponto</button>
        </div>
      </div>

      <div class="secao">
        <h3>2. Densidade da grade</h3>
        <div class="presets" id="presets"></div>
        <div class="grid2">
          <div>
            <label class="campo">Espaçamento (m)</label>
            <input type="number" id="input-espacamento" value="141" min="10" step="1">
          </div>
          <div>
            <label class="campo">≈ ha por ponto</label>
            <input type="number" id="input-ha-ponto" value="2" min="0.1" step="0.1">
          </div>
        </div>
        <label class="campo">Modo do ponto</label>
        <div class="toggle-modo">
          <div class="ativo" data-modo="centro">Centro da célula</div>
          <div data-modo="intersecao">Interseção</div>
        </div>
        <div class="linha-btns" style="margin-top:12px;">
          <button class="btn ouro" id="btn-gerar" disabled>▦ Gerar grade</button>
        </div>
        <div class="stats">
          <div class="stat"><b id="st-area">0,00</b><span>ha da área</span></div>
          <div class="stat"><b id="st-pontos">0</b><span>pontos</span></div>
          <div class="stat"><b id="st-dens">–</b><span>ha/ponto real</span></div>
        </div>
      </div>

      <div class="secao">
        <h3>Imagens offline (satélite/mapa)</h3>
        <div class="linha-btns">
          <button class="btn" id="btn-baixar-tiles">⬇️ Baixar área do talhão</button>
        </div>
        <div class="barra-progresso" id="barra-progresso"><div class="fill" id="barra-fill"></div></div>
        <div class="progresso-txt" id="progresso-txt"></div>
      </div>

      <div class="secao" id="secao-pontos" style="display:none;">
        <h3>3. Pontos gerados</h3>
        <div id="lista-pontos"></div>
        <div class="linha-btns" style="margin-top:10px;">
          <button class="btn" id="btn-csv">📄 CSV</button>
          <button class="btn" id="btn-gpx">🛰️ GPX</button>
          <button class="btn" id="btn-kml">🌍 KML</button>
        </div>
        <div class="linha-btns" style="margin-top:8px;">
          <button class="btn ouro" id="btn-whatsapp">💬 Enviar por WhatsApp</button>
        </div>
      </div>

      <div class="secao">
        <h3>Salvar / Carregar talhão</h3>
        <div class="grid2">
          <input type="text" id="input-nome-talhao" placeholder="Nome do talhão">
          <button class="btn ouro sm" id="btn-salvar">💾 Salvar</button>
        </div>
        <div id="talhoes-salvos" style="margin-top:10px;"></div>
      </div>

      <div class="rodape-app">Desenvolvido por João Divino Barbosa</div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ===================== PWA: manifest + service worker via Blob ===================== */
(function(){
  const svgIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <rect width="100" height="100" rx="20" fill="#0d1f14"/>
    <rect x="8" y="8" width="84" height="84" rx="14" fill="#123822" stroke="#f0c040" stroke-width="3"/>
    <path d="M32 16v68M68 16v68M16 32h68M16 68h68" stroke="#f0c040" stroke-width="4"/>
  </svg>`;
  const iconUrl = "data:image/svg+xml;base64," + btoa(svgIcon);

  const manifest = {
    name: "Grade de Amostragem de Solo",
    short_name: "Grade Solo",
    start_url: "./",
    display: "standalone",
    background_color: "#0d1f14",
    theme_color: "#0d1f14",
    icons: [
      { src: iconUrl, sizes: "100x100", type: "image/svg+xml", purpose: "any maskable" }
    ]
  };
  const manifestBlob = new Blob([JSON.stringify(manifest)], {type:"application/json"});
  const manifestUrl = URL.createObjectURL(manifestBlob);
  const link = document.createElement("link");
  link.rel = "manifest";
  link.href = manifestUrl;
  document.head.appendChild(link);

  const swCode = `
    const CACHE = 'grade-solo-v2';
    self.addEventListener('install', e => { self.skipWaiting(); });
    self.addEventListener('activate', e => { self.clients.claim(); });
    self.addEventListener('fetch', event => {
      if (event.request.method !== 'GET') return;
      event.respondWith(
        caches.match(event.request).then(cached => {
          const fetchPromise = fetch(event.request).then(networkResp => {
            // status 200 = resposta normal; status 0 = opaca (tiles cross-origin sem CORS), ambas cacheáveis
            if (networkResp && (networkResp.status === 200 || networkResp.type === 'opaque')) {
              caches.open(CACHE).then(cache => cache.put(event.request, networkResp.clone()));
            }
            return networkResp;
          }).catch(() => cached);
          return cached || fetchPromise;
        })
      );
    });
  `;
  const swBlob = new Blob([swCode], {type:"application/javascript"});
  const swUrl = URL.createObjectURL(swBlob);
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register(swUrl).catch(()=>{});
  }

  let deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    document.getElementById('btn-instalar').style.display = 'flex';
  });
  document.getElementById('btn-instalar').addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    document.getElementById('btn-instalar').style.display = 'none';
  });
})();

/* ===================== Toast ===================== */
function toast(msg, ms=2200){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._h);
  toast._h = setTimeout(()=>t.classList.remove('show'), ms);
}

/* ===================== Painel arrastável ===================== */
const painel = document.getElementById('painel');
document.getElementById('alca').addEventListener('click', ()=> {
  painel.classList.toggle('aberto');
  document.getElementById('seta-alca').textContent = painel.classList.contains('aberto') ? '▲ fechar' : '▼ ferramentas';
});

/* ===================== Mapa ===================== */
const map = L.map('map', {zoomControl:false}).setView([-3.35, -43.35], 13); // região Chapadinha/Urbano Santos - MA
L.control.zoom({position:'bottomright'}).addTo(map);

const camadaMapa = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '© OpenStreetMap'
});
const camadaSatelite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 19, attribution: '© Esri World Imagery'
});
camadaMapa.addTo(map);
let usandoSatelite = false;
document.getElementById('btn-camada').addEventListener('click', () => {
  usandoSatelite = !usandoSatelite;
  if (usandoSatelite){ map.removeLayer(camadaMapa); camadaSatelite.addTo(map); toast('Camada: satélite'); }
  else { map.removeLayer(camadaSatelite); camadaMapa.addTo(map); toast('Camada: mapa'); }
});

document.getElementById('btn-gps').addEventListener('click', () => {
  if (!navigator.geolocation) return toast('GPS não disponível neste dispositivo.');
  navigator.geolocation.getCurrentPosition(pos => {
    const {latitude, longitude} = pos.coords;
    map.setView([latitude, longitude], 17);
    L.circleMarker([latitude, longitude], {radius:7, color:'#f0c040', fillColor:'#f0c040', fillOpacity:.9}).addTo(map);
  }, () => toast('Não foi possível obter localização.'), {enableHighAccuracy:true});
});

/* ===================== Estado do talhão ===================== */
let desenhando = false;
let vertices = [];        // [{lat,lng}]
let vertMarkers = [];
let linhaPoligono = null;
let poligonoFinal = null;
let camadaGrade = L.layerGroup().addTo(map);
let pontosGerados = [];    // [{id, lat, lng, celula}]

const btnDesenhar = document.getElementById('btn-desenhar');
const btnFechar = document.getElementById('btn-fechar');
const btnLimpar = document.getElementById('btn-limpar');
const btnAddGps = document.getElementById('btn-add-gps');
const btnDesfazer = document.getElementById('btn-desfazer');
const btnGerar = document.getElementById('btn-gerar');

function atualizarLinha(){
  if (linhaPoligono) map.removeLayer(linhaPoligono);
  if (vertices.length > 1){
    linhaPoligono = L.polyline(vertices.map(v=>[v.lat,v.lng]), {color:'#f0c040', weight:3, dashArray: desenhando ? '6,6' : null}).addTo(map);
  }
}

function addVertice(lat, lng){
  vertices.push({lat,lng});
  const m = L.circleMarker([lat,lng], {radius:6, color:'#f0c040', fillColor:'#123822', fillOpacity:1, weight:2}).addTo(map);
  vertMarkers.push(m);
  atualizarLinha();
  btnDesfazer.disabled = vertices.length === 0;
  btnFechar.disabled = vertices.length < 3;
}

map.on('click', (e) => {
  if (!desenhando) return;
  addVertice(e.latlng.lat, e.latlng.lng);
});

btnDesenhar.addEventListener('click', () => {
  limparTudo(false);
  desenhando = true;
  btnDesenhar.disabled = true;
  btnAddGps.disabled = false;
  btnDesfazer.disabled = true;
  btnFechar.disabled = true;
  toast('Toque no mapa para marcar os vértices do talhão.');
});

btnAddGps.addEventListener('click', () => {
  if (!navigator.geolocation) return toast('GPS não disponível.');
  navigator.geolocation.getCurrentPosition(pos => {
    addVertice(pos.coords.latitude, pos.coords.longitude);
    map.setView([pos.coords.latitude, pos.coords.longitude], map.getZoom());
  }, () => toast('Não foi possível obter localização.'), {enableHighAccuracy:true});
});

btnDesfazer.addEventListener('click', () => {
  if (!vertices.length) return;
  vertices.pop();
  const m = vertMarkers.pop();
  if (m) map.removeLayer(m);
  atualizarLinha();
  btnDesfazer.disabled = vertices.length === 0;
  btnFechar.disabled = vertices.length < 3;
});

btnFechar.addEventListener('click', () => {
  if (vertices.length < 3) return toast('Marque pelo menos 3 pontos.');
  desenhando = false;
  if (linhaPoligono) { map.removeLayer(linhaPoligono); linhaPoligono = null; }
  poligonoFinal = L.polygon(vertices.map(v=>[v.lat,v.lng]), {
    color:'#f0c040', weight:2.5, fillColor:'#5ac084', fillOpacity:.12
  }).addTo(map);
  map.fitBounds(poligonoFinal.getBounds(), {padding:[40,40]});
  btnDesenhar.disabled = false;
  btnFechar.disabled = true;
  btnAddGps.disabled = true;
  btnDesfazer.disabled = true;
  btnGerar.disabled = false;
  calcularArea();
  toast('Talhão fechado. Configure a densidade e gere a grade.');
});

btnLimpar.addEventListener('click', () => limparTudo(true));

function limparTudo(avisar){
  desenhando = false;
  vertices = [];
  vertMarkers.forEach(m => map.removeLayer(m));
  vertMarkers = [];
  if (linhaPoligono) { map.removeLayer(linhaPoligono); linhaPoligono = null; }
  if (poligonoFinal) { map.removeLayer(poligonoFinal); poligonoFinal = null; }
  camadaGrade.clearLayers();
  pontosGerados = [];
  btnDesenhar.disabled = false;
  btnFechar.disabled = true;
  btnAddGps.disabled = true;
  btnDesfazer.disabled = true;
  btnGerar.disabled = true;
  document.getElementById('secao-pontos').style.display = 'none';
  atualizarResumo();
  if (avisar) toast('Talhão e grade limpos.');
}

/* ===================== Geometria ===================== */
const M_POR_GRAU_LAT = 111320;
function mPorGrauLng(latDeg){ return 111320 * Math.cos(latDeg * Math.PI/180); }

// Shoelace em coordenadas métricas locais (projeção equirretangular simples)
function calcularAreaHa(pts){
  if (pts.length < 3) return 0;
  const lat0 = pts.reduce((s,p)=>s+p.lat,0)/pts.length;
  const mLng = mPorGrauLng(lat0);
  const xy = pts.map(p => ({x: p.lng*mLng, y: p.lat*M_POR_GRAU_LAT}));
  let area = 0;
  for (let i=0;i<xy.length;i++){
    const a = xy[i], b = xy[(i+1)%xy.length];
    area += a.x*b.y - b.x*a.y;
  }
  return Math.abs(area/2)/10000; // ha
}

function pontoDentroPoligono(lat, lng, poly){
  let dentro = false;
  for (let i=0, j=poly.length-1; i<poly.length; j=i++){
    const xi = poly[i].lng, yi = poly[i].lat;
    const xj = poly[j].lng, yj = poly[j].lat;
    const intersecta = ((yi>lat) !== (yj>lat)) &&
      (lng < (xj-xi) * (lat-yi) / (yj-yi) + xi);
    if (intersecta) dentro = !dentro;
  }
  return dentro;
}

function calcularArea(){
  const areaHa = calcularAreaHa(vertices);
  document.getElementById('st-area').textContent = areaHa.toFixed(2).replace('.',',');
  document.getElementById('resumo-area').textContent = areaHa.toFixed(2).replace('.',',') + ' ha';
}

/* ===================== Densidade: presets ===================== */
const presetsHa = [1, 2, 3, 5, 10, 20];
const presetsWrap = document.getElementById('presets');
presetsHa.forEach(ha => {
  const b = document.createElement('div');
  b.className = 'preset' + (ha===2 ? ' ativo':'');
  b.textContent = ha + ' ha/pt';
  b.dataset.ha = ha;
  b.addEventListener('click', () => {
    document.querySelectorAll('.preset').forEach(p=>p.classList.remove('ativo'));
    b.classList.add('ativo');
    aplicarDensidadeHa(ha);
  });
  presetsWrap.appendChild(b);
});

const inputEspacamento = document.getElementById('input-espacamento');
const inputHaPonto = document.getElementById('input-ha-ponto');

function aplicarDensidadeHa(ha){
  const espacamento = Math.sqrt(ha * 10000);
  inputHaPonto.value = ha;
  inputEspacamento.value = Math.round(espacamento);
}
function aplicarEspacamento(m){
  const ha = (m*m)/10000;
  inputHaPonto.value = ha.toFixed(2);
}
inputEspacamento.addEventListener('input', () => {
  document.querySelectorAll('.preset').forEach(p=>p.classList.remove('ativo'));
  aplicarEspacamento(parseFloat(inputEspacamento.value)||0);
});
inputHaPonto.addEventListener('input', () => {
  document.querySelectorAll('.preset').forEach(p=>p.classList.remove('ativo'));
  aplicarDensidadeHa(parseFloat(inputHaPonto.value)||0);
});

let modoPonto = 'centro';
document.querySelectorAll('.toggle-modo div').forEach(el => {
  el.addEventListener('click', () => {
    document.querySelectorAll('.toggle-modo div').forEach(e=>e.classList.remove('ativo'));
    el.classList.add('ativo');
    modoPonto = el.dataset.modo;
  });
});

/* ===================== Gerar grade ===================== */
btnGerar.addEventListener('click', () => {
  if (!poligonoFinal || vertices.length < 3) return toast('Feche o talhão primeiro.');
  const espacamento = parseFloat(inputEspacamento.value);
  if (!espacamento || espacamento < 5) return toast('Informe um espaçamento válido (m).');

  camadaGrade.clearLayers();
  pontosGerados = [];

  const lats = vertices.map(v=>v.lat), lngs = vertices.map(v=>v.lng);
  const latMin = Math.min(...lats), latMax = Math.max(...lats);
  const lngMin = Math.min(...lngs), lngMax = Math.max(...lngs);

  const latCentral = (latMin+latMax)/2;
  const dLat = espacamento / M_POR_GRAU_LAT;
  const dLng = espacamento / mPorGrauLng(latCentral);
  const offset = modoPonto === 'centro' ? 0.5 : 0;

  const nLinhas = Math.ceil((latMax-latMin)/dLat) + 1;
  const nCols = Math.ceil((lngMax-lngMin)/dLng) + 1;

  let id = 1;
  for (let i=0; i<nLinhas; i++){
    for (let j=0; j<nCols; j++){
      const lat = latMin + (i+offset)*dLat;
      const lng = lngMin + (j+offset)*dLng;
      if (lat > latMax + dLat || lng > lngMax + dLng) continue;
      if (pontoDentroPoligono(lat, lng, vertices)){
        pontosGerados.push({id, lat, lng, celula: `L${i+1}C${j+1}`});
        id++;
      }
    }
  }

  if (!pontosGerados.length){
    toast('Nenhum ponto caiu dentro do talhão — tente um espaçamento menor.');
    return;
  }

  pontosGerados.forEach(p => {
    const icon = L.divIcon({className:'', html:`<div class="rotulo-ponto">${p.id}</div>`, iconSize:[20,20]});
    L.marker([p.lat, p.lng], {icon}).addTo(camadaGrade)
      .bindPopup(`<b>Ponto ${p.id}</b><br>${p.lat.toFixed(6)}, ${p.lng.toFixed(6)}<br>Célula ${p.celula}`);
  });

  renderListaPontos();
  atualizarResumo();
  toast(`${pontosGerados.length} pontos gerados.`);
});

function renderListaPontos(){
  const areaHa = calcularAreaHa(vertices);
  document.getElementById('st-pontos').textContent = pontosGerados.length;
  document.getElementById('st-dens').textContent = pontosGerados.length
    ? (areaHa/pontosGerados.length).toFixed(2).replace('.',',') : '–';

  const lista = document.getElementById('lista-pontos');
  lista.innerHTML = '';
  pontosGerados.forEach(p => {
    const el = document.createElement('div');
    el.className = 'item-ponto';
    el.innerHTML = `<span><b>#${p.id}</b> · ${p.celula}</span><span class="coord">${p.lat.toFixed(6)}, ${p.lng.toFixed(6)}</span>`;
    el.addEventListener('click', () => map.setView([p.lat, p.lng], 18));
    lista.appendChild(el);
  });
  document.getElementById('secao-pontos').style.display = pontosGerados.length ? 'block' : 'none';
}

function atualizarResumo(){
  document.getElementById('resumo-pontos').textContent = pontosGerados.length;
  calcularArea();
}

/* ===================== Exportação ===================== */
function baixar(nome, conteudo, tipo){
  const blob = new Blob([conteudo], {type:tipo});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nome;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

document.getElementById('btn-csv').addEventListener('click', () => {
  if (!pontosGerados.length) return;
  let csv = 'ID;Celula;Latitude;Longitude\n';
  pontosGerados.forEach(p => csv += `${p.id};${p.celula};${p.lat.toFixed(7)};${p.lng.toFixed(7)}\n`);
  baixar('grade-amostragem-solo.csv', csv, 'text/csv;charset=utf-8');
  toast('CSV exportado.');
});

document.getElementById('btn-gpx').addEventListener('click', () => {
  if (!pontosGerados.length) return;
  let gpx = `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Grade de Amostragem de Solo" xmlns="http://www.topografix.com/GPX/1/1">\n`;
  pontosGerados.forEach(p => {
    gpx += `  <wpt lat="${p.lat.toFixed(7)}" lon="${p.lng.toFixed(7)}"><name>P${p.id}</name><desc>${p.celula}</desc></wpt>\n`;
  });
  gpx += `</gpx>`;
  baixar('grade-amostragem-solo.gpx', gpx, 'application/gpx+xml');
  toast('GPX exportado.');
});

document.getElementById('btn-kml').addEventListener('click', () => {
  if (!pontosGerados.length) return;
  let kml = `<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2"><Document>\n`;
  pontosGerados.forEach(p => {
    kml += `<Placemark><name>P${p.id}</name><description>${p.celula}</description><Point><coordinates>${p.lng.toFixed(7)},${p.lat.toFixed(7)},0</coordinates></Point></Placemark>\n`;
  });
  kml += `</Document></kml>`;
  baixar('grade-amostragem-solo.kml', kml, 'application/vnd.google-earth.kml+xml');
  toast('KML exportado.');
});

/* ===================== Salvar / Carregar talhões (localStorage) ===================== */
const CHAVE_LS = 'grade_solo_talhoes';

function listarTalhoesSalvos(){
  try { return JSON.parse(localStorage.getItem(CHAVE_LS)) || []; } catch(e){ return []; }
}
function salvarTalhoesSalvos(lista){
  localStorage.setItem(CHAVE_LS, JSON.stringify(lista));
}

document.getElementById('btn-salvar').addEventListener('click', () => {
  const nome = document.getElementById('input-nome-talhao').value.trim();
  if (!nome) return toast('Dê um nome ao talhão.');
  if (vertices.length < 3) return toast('Desenhe e feche um talhão antes de salvar.');
  const lista = listarTalhoesSalvos();
  lista.push({
    nome, data: new Date().toISOString(),
    vertices, pontos: pontosGerados,
    espacamento: parseFloat(inputEspacamento.value), modo: modoPonto
  });
  salvarTalhoesSalvos(lista);
  document.getElementById('input-nome-talhao').value = '';
  renderTalhoesSalvos();
  toast('Talhão salvo no dispositivo.');
});

function renderTalhoesSalvos(){
  const wrap = document.getElementById('talhoes-salvos');
  const lista = listarTalhoesSalvos();
  wrap.innerHTML = '';
  if (!lista.length){
    wrap.innerHTML = '<div style="font-size:12px;color:var(--texto-fraco);">Nenhum talhão salvo ainda.</div>';
    return;
  }
  lista.forEach((t, idx) => {
    const areaHa = calcularAreaHa(t.vertices);
    const el = document.createElement('div');
    el.className = 'item-talhao';
    el.innerHTML = `<div>${t.nome}<br><span>${areaHa.toFixed(2).replace('.',',')} ha · ${t.pontos.length} pontos</span></div>`;
    const acoes = document.createElement('div');
    acoes.style.display = 'flex'; acoes.style.gap = '6px';
    const btnAbrir = document.createElement('button');
    btnAbrir.className = 'btn sm ouro'; btnAbrir.textContent = 'Abrir';
    btnAbrir.addEventListener('click', () => carregarTalhao(t));
    const btnDel = document.createElement('button');
    btnDel.className = 'btn sm perigo'; btnDel.textContent = '✕';
    btnDel.addEventListener('click', () => {
      const l2 = listarTalhoesSalvos(); l2.splice(idx,1); salvarTalhoesSalvos(l2); renderTalhoesSalvos();
    });
    acoes.appendChild(btnAbrir); acoes.appendChild(btnDel);
    el.appendChild(acoes);
    wrap.appendChild(el);
  });
}

function carregarTalhao(t){
  limparTudo(false);
  vertices = t.vertices.map(v=>({lat:v.lat,lng:v.lng}));
  vertices.forEach(v => {
    const m = L.circleMarker([v.lat,v.lng], {radius:6, color:'#f0c040', fillColor:'#123822', fillOpacity:1, weight:2}).addTo(map);
    vertMarkers.push(m);
  });
  poligonoFinal = L.polygon(vertices.map(v=>[v.lat,v.lng]), {
    color:'#f0c040', weight:2.5, fillColor:'#5ac084', fillOpacity:.12
  }).addTo(map);
  map.fitBounds(poligonoFinal.getBounds(), {padding:[40,40]});
  inputEspacamento.value = t.espacamento;
  aplicarEspacamento(t.espacamento);
  modoPonto = t.modo || 'centro';
  document.querySelectorAll('.toggle-modo div').forEach(e => e.classList.toggle('ativo', e.dataset.modo===modoPonto));

  pontosGerados = t.pontos || [];
  pontosGerados.forEach(p => {
    const icon = L.divIcon({className:'', html:`<div class="rotulo-ponto">${p.id}</div>`, iconSize:[20,20]});
    L.marker([p.lat, p.lng], {icon}).addTo(camadaGrade)
      .bindPopup(`<b>Ponto ${p.id}</b><br>${p.lat.toFixed(6)}, ${p.lng.toFixed(6)}<br>Célula ${p.celula}`);
  });

  btnDesenhar.disabled = false;
  btnGerar.disabled = false;
  renderListaPontos();
  atualizarResumo();
  painel.classList.add('aberto');
  toast(`Talhão "${t.nome}" carregado.`);
}

renderTalhoesSalvos();

/* ===================== Download de imagens offline (tiles) ===================== */
function latLngParaTile(lat, lng, z){
  const n = Math.pow(2, z);
  const x = Math.floor((lng + 180) / 360 * n);
  const latRad = lat * Math.PI / 180;
  const y = Math.floor((1 - Math.log(Math.tan(latRad) + 1/Math.cos(latRad)) / Math.PI) / 2 * n);
  return {x, y};
}

function urlTile(z, x, y){
  return usandoSatelite
    ? `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}`
    : `https://a.tile.openstreetmap.org/${z}/${x}/${y}.png`;
}

document.getElementById('btn-baixar-tiles').addEventListener('click', async () => {
  if (!poligonoFinal || vertices.length < 3) return toast('Desenhe e feche um talhão primeiro.');
  if (!('caches' in window)) return toast('Cache offline não suportado neste navegador.');

  const lats = vertices.map(v=>v.lat), lngs = vertices.map(v=>v.lng);
  const latMin = Math.min(...lats)-0.002, latMax = Math.max(...lats)+0.002;
  const lngMin = Math.min(...lngs)-0.002, lngMax = Math.max(...lngs)+0.002;

  const zoomAtual = map.getZoom();
  const zooms = [...new Set([zoomAtual, Math.min(zoomAtual+1,19), Math.min(zoomAtual+2,19), 17, 18].filter(z=>z<=19))];

  let tiles = [];
  zooms.forEach(z => {
    const tMin = latLngParaTile(latMax, lngMin, z);
    const tMax = latLngParaTile(latMin, lngMax, z);
    for (let x = tMin.x; x <= tMax.x; x++){
      for (let y = tMin.y; y <= tMax.y; y++){
        tiles.push(urlTile(z, x, y));
      }
    }
  });
  tiles = [...new Set(tiles)];

  if (!tiles.length) return toast('Nada para baixar.');

  const barra = document.getElementById('barra-progresso');
  const fill = document.getElementById('barra-fill');
  const txt = document.getElementById('progresso-txt');
  barra.style.display = 'block';
  txt.style.display = 'block';

  const cache = await caches.open('grade-solo-v2');
  let feitos = 0;
  const concorrencia = 6;
  let falhas = 0;

  async function baixarUm(url){
    try {
      const resp = await fetch(url, {mode:'no-cors'});
      await cache.put(url, resp);
    } catch(e){ falhas++; }
    feitos++;
    const pct = Math.round((feitos/tiles.length)*100);
    fill.style.width = pct + '%';
    txt.textContent = `Baixando imagens offline: ${feitos}/${tiles.length} (${pct}%)`;
  }

  for (let i = 0; i < tiles.length; i += concorrencia){
    const lote = tiles.slice(i, i+concorrencia).map(baixarUm);
    await Promise.all(lote);
  }

  txt.textContent = falhas
    ? `Concluído com ${falhas} falha(s). ${tiles.length-falhas} imagens salvas para uso offline.`
    : `Concluído! ${tiles.length} imagens salvas para uso offline.`;
  toast('Download de imagens offline concluído.');
  setTimeout(()=>{ barra.style.display='none'; }, 3000);
});

/* ===================== Compartilhar via WhatsApp ===================== */
document.getElementById('btn-whatsapp').addEventListener('click', async () => {
  if (!pontosGerados.length) return toast('Gere a grade antes de compartilhar.');

  let texto = `📍 *Grade de Amostragem de Solo*\n`;
  texto += `Pontos: ${pontosGerados.length} · Área: ${calcularAreaHa(vertices).toFixed(2).replace('.',',')} ha\n\n`;
  pontosGerados.slice(0, 30).forEach(p => {
    texto += `P${p.id} (${p.celula}): ${p.lat.toFixed(6)}, ${p.lng.toFixed(6)}\n`;
  });
  if (pontosGerados.length > 30) texto += `\n(+${pontosGerados.length-30} pontos — exporte o CSV/GPX para a lista completa)`;

  let csv = 'ID;Celula;Latitude;Longitude\n';
  pontosGerados.forEach(p => csv += `${p.id};${p.celula};${p.lat.toFixed(7)};${p.lng.toFixed(7)}\n`);
  const arquivoCsv = new File([csv], 'grade-amostragem-solo.csv', {type:'text/csv'});

  if (navigator.canShare && navigator.canShare({files:[arquivoCsv]})){
    try {
      await navigator.share({title:'Grade de Amostragem de Solo', text: texto, files:[arquivoCsv]});
      return;
    } catch(e){ /* usuário cancelou ou falhou — cai no fallback abaixo */ }
  }

  const url = `https://wa.me/?text=${encodeURIComponent(texto)}`;
  window.open(url, '_blank');
});
